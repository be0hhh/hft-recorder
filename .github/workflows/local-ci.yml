name: local-ci

run-name: local-ci ${{ github.event.client_payload.snapshot_id || github.run_id }} ${{ github.event.client_payload.dispatch_id || 'manual' }}

on:
  repository_dispatch:
    types: [family-build]
  workflow_dispatch:
    inputs:
      profile:
        description: Family CI composition
        type: choice
        options: [essential, full]
        default: essential
      mode:
        description: Build own revision or revalidate dependencies
        type: choice
        options: [own, dependency]
        default: own

permissions:
  contents: read

concurrency:
  group: local-ci-${{ github.repository }}-${{ github.event.client_payload.snapshot_id || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: /home/gha-runner/github-actions/bin/gha-heavy-shell {0}

env:
  CCACHE_DIR: /home/gha-runner/github-actions/cache/ccache
  CCACHE_MAXSIZE: 15G
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

jobs:
  snapshot:
    name: snapshot-contract
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    outputs:
      mode: ${{ steps.snapshot.outputs.mode }}
      snapshot_id: ${{ steps.snapshot.outputs.snapshot_id }}
      snapshot_json: ${{ steps.snapshot.outputs.snapshot_json }}
      cxetcpp_sha: ${{ steps.snapshot.outputs.cxetcpp_sha }}
    steps:
      - name: Require family token
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || {
            echo '::error::CI_FAMILY_READ_TOKEN is required for exact family CI.'
            exit 1
          }
      - name: Checkout exact family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ github.event.client_payload.snapshot.cxetcpp || 'main' }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          persist-credentials: false
          clean: false
          sparse-checkout: |
            .github/actions
            tools/Ci
          path: controller
      - name: Resolve immutable revisions for manual runs
        id: manual
        if: github.event_name == 'workflow_dispatch'
        uses: ./controller/.github/actions/resolve-family-revisions
        with:
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          profile: ${{ inputs.profile }}
      - name: Validate exact snapshot and dispatch schema
        id: snapshot
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_PROFILE: ${{ inputs.profile }}
          MANUAL_REVISIONS: ${{ toJSON(steps.manual.outputs) }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, re, subprocess, sys
          sys.path.insert(0, 'controller/tools/Ci')
          from FamilyCiController import DEFAULT_GRAPH, FamilyGraph, repository_snapshot_id, validate_snapshot
          payload = json.loads(os.environ['DISPATCH_PAYLOAD'])
          dispatched = os.environ['GITHUB_EVENT_NAME'] == 'repository_dispatch'
          if dispatched:
              if not isinstance(payload, dict) or payload.get('schema_version') != 5:
                  raise SystemExit('family-build requires schema_version=5')
              snapshot, mode = payload.get('snapshot'), payload.get('mode')
              for field in ('trigger_sha',):
                  if not isinstance(payload.get(field), str) or not re.fullmatch(r'[0-9a-f]{40}', payload[field]):
                      raise SystemExit(f'invalid family-build {field}')
              for field in ('trigger_repo', 'dispatch_id', 'snapshot_id'):
                  if not isinstance(payload.get(field), str) or not payload[field]:
                      raise SystemExit(f'invalid family-build {field}')
          else:
              revisions = json.loads(os.environ['MANUAL_REVISIONS'])
              profile = os.environ['MANUAL_PROFILE'] or 'essential'
              graph = FamilyGraph.load(DEFAULT_GRAPH, profile=profile)
              snapshot = {graph.snapshot_key(name): revisions[graph.snapshot_key(name) + '_sha'] for name in graph.active_repositories}
              snapshot['_profile'] = profile
              mode = os.environ['MANUAL_MODE'] or 'own'
          if mode not in ('own', 'dependency') or not isinstance(snapshot, dict):
              raise SystemExit('invalid family-build mode or snapshot')
          graph = FamilyGraph.load(DEFAULT_GRAPH, profile=snapshot.get('_profile'))
          snapshot = validate_snapshot(graph, snapshot)
          expected = repository_snapshot_id(graph, os.environ['GITHUB_REPOSITORY'], snapshot)
          if dispatched and payload['snapshot_id'] != expected:
              raise SystemExit('family-build snapshot_id mismatch')
          actual = subprocess.check_output(['git', '-C', 'controller', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != snapshot['cxetcpp']:
              raise SystemExit('controller checkout differs from snapshot.cxetcpp')
          compact = json.dumps(snapshot, sort_keys=True, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'mode={mode}\nsnapshot_id={expected}\nsnapshot_json={compact}\ncxetcpp_sha={snapshot["cxetcpp"]}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'### Exact family snapshot `{expected}` ({mode}, {snapshot["_profile"]})\n\n')
          PYCODE
      - name: Checkout and validate claimed source inputs
        uses: ./controller/.github/actions/checkout-family-source
        with:
          source-ref: ${{ steps.snapshot.outputs.cxetcpp_sha }}
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          profile: ${{ fromJSON(steps.snapshot.outputs.snapshot_json)._profile }}
          source-root: source/CXETCPP
          snapshot-json: ${{ steps.snapshot.outputs.snapshot_json }}
      - name: Claim exact dispatched snapshot
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ steps.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
          DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py claim
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --dispatch-id "$DISPATCH_ID"

  production-build:
    name: production-build
    needs: snapshot
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-recorder]
    timeout-minutes: 360
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
      CXET_FAMILY_PROFILE: ${{ fromJSON(needs.snapshot.outputs.snapshot_json)._profile }}
      FAMILY_REPOSITORY_SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
      GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
      GHA_PRIORITY: 10
      CXET_BUILD_DIR: ${{ github.workspace }}/source/CXETCPP/build/modes/ci-hft-recorder-portable
    steps:
      - name: Require family token
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || {
            echo '::error::CI_FAMILY_READ_TOKEN is required for exact family CI.'
            exit 1
          }
      - name: Checkout exact workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          persist-credentials: false
          clean: false
          sparse-checkout: |
            .github/actions
            tools/Ci
          path: controller
      - name: Checkout and validate exact source inputs independently
        uses: ./controller/.github/actions/checkout-family-source
        with:
          source-ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          profile: ${{ fromJSON(needs.snapshot.outputs.snapshot_json)._profile }}
          source-root: source/CXETCPP
          snapshot-json: ${{ needs.snapshot.outputs.snapshot_json }}
      - name: Set up pinned LLVM
        uses: ./controller/.github/actions/setup-toolchain
        with:
          source-root: source/CXETCPP
          local-cache-root: /home/gha-runner/github-actions/cache/toolchains/wsl-ci-cxetcpp
      - name: Build owner production dependency closure and stage exact product
        working-directory: source/CXETCPP
        run: |
          set -euo pipefail
          bash server/check-openssl-baseline.sh --role build
          python3 tools/Ci/FamilyCiWorkspace.py source --root "$PWD" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON"
          ./apps/hft-recorder/compile.sh portable p -j4
          python3 tools/Ci/FamilyCiWorkspace.py record --root "$PWD" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$CXET_BUILD_DIR"
          python3 tools/Ci/FamilyCiWorkspace.py verify --root "$PWD" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$CXET_BUILD_DIR"
          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch ]]; then
            python3 tools/Ci/FamilyCiController.py stage-artifact --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --snapshot-id "$FAMILY_REPOSITORY_SNAPSHOT_ID" --artifact-path "$CXET_BUILD_DIR"
          else
            echo "Manual build: family staging and status publication are not performed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summarize declared local checks
        run: |
          echo 'Local tests: undeclared for this owner.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compilation and artifact staging establish buildable; ready and family closure are separate publications.' >> "$GITHUB_STEP_SUMMARY"

  publish-buildable:
    name: publish-buildable
    needs: [snapshot, production-build]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      needs.production-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
      SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
      SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
      CI_MODE: ${{ needs.snapshot.outputs.mode }}
    steps:
      - name: Require family token
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || {
            echo '::error::CI_FAMILY_READ_TOKEN is required for exact family CI.'
            exit 1
          }
      - name: Checkout exact workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          persist-credentials: false
          clean: false
          sparse-checkout: |
            .github/actions
            tools/Ci
          path: controller
      - name: Checkout and validate exact source inputs independently
        uses: ./controller/.github/actions/checkout-family-source
        with:
          source-ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          profile: ${{ fromJSON(needs.snapshot.outputs.snapshot_json)._profile }}
          source-root: source/CXETCPP
          snapshot-json: ${{ needs.snapshot.outputs.snapshot_json }}
      - name: publish-buildable
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-buildable
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE"

  publish-ready:
    name: publish-ready
    needs: [snapshot, production-build, publish-buildable]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      needs.production-build.result == 'success' && needs.publish-buildable.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
      SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
      SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
      CI_MODE: ${{ needs.snapshot.outputs.mode }}
    steps:
      - name: Require family token
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || {
            echo '::error::CI_FAMILY_READ_TOKEN is required for exact family CI.'
            exit 1
          }
      - name: Checkout exact workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          persist-credentials: false
          clean: false
          sparse-checkout: |
            .github/actions
            tools/Ci
          path: controller
      - name: Checkout and validate exact source inputs independently
        uses: ./controller/.github/actions/checkout-family-source
        with:
          source-ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          profile: ${{ fromJSON(needs.snapshot.outputs.snapshot_json)._profile }}
          source-root: source/CXETCPP
          snapshot-json: ${{ needs.snapshot.outputs.snapshot_json }}
      - name: publish-ready
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE"

  publish-build-failed:
    name: publish-build-failed
    needs: [snapshot, production-build]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      (needs.production-build.result == 'failure' || needs.production-build.result == 'cancelled')
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
      SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
      SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
      CI_MODE: ${{ needs.snapshot.outputs.mode }}
    steps:
      - name: Require family token
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || {
            echo '::error::CI_FAMILY_READ_TOKEN is required for exact family CI.'
            exit 1
          }
      - name: Checkout exact workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          persist-credentials: false
          clean: false
          sparse-checkout: |
            .github/actions
            tools/Ci
          path: controller
      - name: Checkout and validate exact source inputs independently
        uses: ./controller/.github/actions/checkout-family-source
        with:
          source-ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          profile: ${{ fromJSON(needs.snapshot.outputs.snapshot_json)._profile }}
          source-root: source/CXETCPP
          snapshot-json: ${{ needs.snapshot.outputs.snapshot_json }}
      - name: publish-build-failed
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-failed
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE" --failure-kind build
