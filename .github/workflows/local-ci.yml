name: local-ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: /home/gha-runner/github-actions/bin/gha-heavy-shell {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/gha-runner/github-actions/cache/ccache
  CCACHE_MAXSIZE: 15G
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  PATH: /usr/bin:/bin:/usr/sbin:/sbin

jobs:
  resolve-family-revisions:
    name: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, benchmark, hft-bench, hft-recorder]
    timeout-minutes: 10
    outputs:
      cxetcpp_sha: ${{ steps.snapshot.outputs.cxetcpp_sha }}
      hft_compressor_sha: ${{ steps.snapshot.outputs.hft_compressor_sha }}
    steps:
      - name: Checkout revision resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: .github/actions/resolve-family-revisions
          persist-credentials: false

      - name: Snapshot family main revisions
        id: snapshot
        uses: ./.github/actions/resolve-family-revisions
        with:
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}

  recorder-corpus-contract:
    name: recorder-corpus-contract
    needs: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-recorder]
    timeout-minutes: 180

    steps:
      - name: Checkout snapshotted CXETCPP root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.resolve-family-revisions.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          submodules: true
          path: source/CXETCPP
          persist-credentials: false

      - name: Overlay snapshotted hft-compressor revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/hft-compressor
          ref: ${{ needs.resolve-family-revisions.outputs.hft_compressor_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP/apps/hft-compressor
          persist-credentials: false

      - name: Overlay triggering hft-recorder revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP/apps/hft-recorder
          persist-credentials: false

      - name: Record source revisions
        run: |
          root_sha="$(git -C source/CXETCPP rev-parse HEAD)"
          compressor_sha="$(git -C source/CXETCPP/apps/hft-compressor rev-parse HEAD)"
          app_sha="$(git -C source/CXETCPP/apps/hft-recorder rev-parse HEAD)"
          printf 'CXETCPP root: %s\nhft-compressor: %s\nhft-recorder overlay: %s\n' "$root_sha" "$compressor_sha" "$app_sha"
          {
            echo "### Source revisions"
            echo "| Source | Commit |"
            echo "| --- | --- |"
            printf '| CXETCPP root | %s |\n' "$root_sha"
            printf '| hft-compressor snapshot | %s |\n' "$compressor_sha"
            printf '| hft-recorder overlay | %s |\n' "$app_sha"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```text'
            git -C source/CXETCPP submodule status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Set up pinned LLVM
        uses: ./source/CXETCPP/.github/actions/setup-toolchain
        with:
          source-root: source/CXETCPP

      - name: Report CMake and CTest binaries
        run: |
          /usr/bin/cmake --version
          /usr/bin/ctest --version

      - name: Configure portable family graph
        working-directory: source/CXETCPP
        run: /usr/bin/cmake --preset clang-ci-family

      - name: Build Recorder corpus consumer contract
        working-directory: source/CXETCPP
        run: >-
          /usr/bin/cmake
          --build build/modes/clang-ci-family
          --target hft-backtest-session-loader-tests
          --parallel 4

      - name: Run Recorder corpus consumer contract
        working-directory: source/CXETCPP
        run: >-
          /usr/bin/ctest
          --test-dir build/modes/clang-ci-family
          -R '^hft-backtest-session-loader-tests$'
          --output-on-failure
          --no-tests=error
          --timeout 180
