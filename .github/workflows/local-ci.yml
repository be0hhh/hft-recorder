name: local-ci

run-name: local-ci ${{ github.event.client_payload.snapshot_id || github.run_id }}

on:
  repository_dispatch:
    types: [family-build]
  workflow_dispatch:
    inputs:
      mode:
        description: Build own revision or revalidate dependencies
        type: choice
        options: [own, dependency]
        default: own

permissions:
  contents: read

concurrency:
  group: local-ci-${{ github.repository }}-${{ github.event.client_payload.snapshot_id || github.run_id }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/gha-runner/github-actions/cache/ccache
  CCACHE_MAXSIZE: 15G
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  PATH: /usr/bin:/bin:/usr/sbin:/sbin

jobs:
  snapshot:
    name: snapshot
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.snapshot.outputs.mode }}
      snapshot_id: ${{ steps.snapshot.outputs.snapshot_id }}
      snapshot_json: ${{ steps.snapshot.outputs.snapshot_json }}
      cxetcpp_sha: ${{ steps.snapshot.outputs.cxetcpp_sha }}
      hft_parser_sha: ${{ steps.snapshot.outputs.hft_parser_sha }}
      hft_compressor_sha: ${{ steps.snapshot.outputs.hft_compressor_sha }}
      source_sha: ${{ steps.snapshot.outputs.source_sha }}
    steps:
      - name: Checkout family revision resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: controller
          sparse-checkout: |
            .github/actions/resolve-family-revisions
            tools/Ci
          persist-credentials: false
      - name: Resolve current family mains for a manual run
        if: github.event_name == 'workflow_dispatch'
        id: fallback
        uses: ./controller/.github/actions/resolve-family-revisions
        with:
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
      - name: Validate immutable family snapshot
        id: snapshot
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_MODE: ${{ inputs.mode }}
          FALLBACK_JSON: >-
            {"cxetcpp":"${{ steps.fallback.outputs.cxetcpp_sha }}","hft_parser":"${{ steps.fallback.outputs.hft_parser_sha }}","hft_compressor":"${{ steps.fallback.outputs.hft_compressor_sha }}","hft_recorder":"${{ steps.fallback.outputs.hft_recorder_sha }}","trading_core":"${{ steps.fallback.outputs.trading_core_sha }}","hft_trader":"${{ steps.fallback.outputs.hft_trader_sha }}","hft_backtest":"${{ steps.fallback.outputs.hft_backtest_sha }}","trader":"${{ steps.fallback.outputs.trader_sha }}","vetron":"${{ steps.fallback.outputs.vetron_sha }}","test_exchanges_helper":"${{ steps.fallback.outputs.test_exchanges_helper_sha }}"}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          keys = {"cxetcpp", "hft_parser", "hft_compressor", "hft_recorder", "trading_core", "hft_trader", "hft_backtest", "trader", "vetron", "test_exchanges_helper"}
          repositories = {"CXETCPP", "TestExchangesHelper", "hft-compressor", "hft-recorder", "hft-parser", "trading-core", "hft-trader", "hft-backtest", "trader", "vetron"}
          if os.environ["GITHUB_EVENT_NAME"] == "repository_dispatch":
              payload = json.loads(os.environ["CLIENT_PAYLOAD"])
              if payload.get("schema_version") != 2:
                  raise SystemExit("family-build requires schema_version=2")
              mode, snapshot, snapshot_id = payload.get("mode"), payload.get("snapshot"), payload.get("snapshot_id")
              if payload.get("trigger_repo") not in repositories or not re.fullmatch(r"[0-9a-f]{40}", str(payload.get("trigger_sha", ""))):
                  raise SystemExit("family-build contains an invalid trigger")
          else:
              mode, snapshot = os.environ.get("MANUAL_MODE") or "own", json.loads(os.environ["FALLBACK_JSON"])
              relevant = {key: snapshot[key] for key in ("cxetcpp", "hft_parser", "hft_compressor", "hft_recorder")}
              snapshot_id = hashlib.sha256(json.dumps(relevant, sort_keys=True, separators=(",", ":")).encode()).hexdigest()[:16]
          if mode not in {"own", "dependency"} or not isinstance(snapshot, dict) or set(snapshot) != keys:
              raise SystemExit("invalid family-build mode or repository set")
          if any(not isinstance(v, str) or not re.fullmatch(r"[0-9a-f]{40}", v) for v in snapshot.values()):
              raise SystemExit("family-build contains an invalid SHA")
          if not isinstance(snapshot_id, str) or not re.fullmatch(r"[0-9a-f]{16}", snapshot_id):
              raise SystemExit("snapshot_id must be a 16-character lowercase digest")
          compact = json.dumps(snapshot, sort_keys=True, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"mode={mode}\nsnapshot_id={snapshot_id}\nsnapshot_json={compact}", file=out)
              print(f"cxetcpp_sha={snapshot['cxetcpp']}\nhft_parser_sha={snapshot['hft_parser']}\nhft_compressor_sha={snapshot['hft_compressor']}\nsource_sha={snapshot['hft_recorder']}", file=out)
          PY
      - name: Claim current dispatched snapshot
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ steps.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py claim
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --dispatch-id "$DISPATCH_ID"

  prepare:
    name: prepare-incremental-tree
    needs: snapshot
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-recorder]
    timeout-minutes: 45
    defaults:
      run:
        shell: /home/gha-runner/github-actions/bin/gha-heavy-shell {0}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Checkout exact root snapshot without cleaning build outputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP
          submodules: false
          clean: false
          persist-credentials: false
      - name: Restore pinned source graph without shallow history
        working-directory: source/CXETCPP
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.CI_FAMILY_READ_TOKEN }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'git@github.com:'
          GIT_CONFIG_KEY_1: 'url.https://x-access-token:${{ secrets.CI_FAMILY_READ_TOKEN }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_1: 'https://github.com/'
        run: |
          git submodule update --init -- tools/exchange_api_probe apps/hft-compressor apps/hft-recorder apps/hft-parser apps/trading-core apps/hft-trader apps/hft-backtest apps/trader apps/vetron extra/abseil-cpp extra/liburing extra/secp256k1 extra/wolfssl || {
            echo "::error::Pinned source revision is unavailable or checkout is incompatible; inspect the submodule error. No automatic cleanup or revision fallback is permitted."
            exit 1
          }
      - name: Overlay exact hft-compressor snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/hft-compressor
          ref: ${{ fromJSON(needs.snapshot.outputs.snapshot_json).hft_compressor }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP/apps/hft-compressor
          clean: false
          persist-credentials: false
      - name: Overlay exact hft-parser snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/hft-parser
          ref: ${{ fromJSON(needs.snapshot.outputs.snapshot_json).hft_parser }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP/apps/hft-parser
          clean: false
          persist-credentials: false
      - name: Overlay exact hft-recorder snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/hft-recorder
          ref: ${{ fromJSON(needs.snapshot.outputs.snapshot_json).hft_recorder }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP/apps/hft-recorder
          clean: false
          persist-credentials: false
      - name: Set up pinned LLVM
        uses: ./source/CXETCPP/.github/actions/setup-toolchain
        with:
          source-root: source/CXETCPP
          local-cache-root: /home/gha-runner/github-actions/cache/toolchains/wsl-ci-cxetcpp
      - name: Configure canonical family graph
        working-directory: source/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" source --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON"
          /usr/bin/cmake --preset clang-ci-family-incremental
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" record --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/CXETCPP/build/modes/clang-ci-family-incremental"

  production-build:
    name: production-build / corpus-core
    if: needs.snapshot.outputs.mode == 'own'
    needs: [snapshot, prepare]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-recorder]
    timeout-minutes: 90
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Build Recorder corpus contract only
        working-directory: source/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/cmake --build build/modes/clang-ci-family-incremental --target hftrec_corpus_contract --parallel 4

  root-integration-build:
    name: root-integration-build / corpus-consumer
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.production-build.result == 'success' || needs.production-build.result == 'skipped')
    needs: [snapshot, prepare, production-build]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-recorder]
    timeout-minutes: 120
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Build the real Backtest consumer of the Recorder corpus contract
        working-directory: source/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/cmake --build build/modes/clang-ci-family-incremental --target hft_backtest_core --parallel 4

  test-build:
    name: test-build / corpus-contract
    needs: [snapshot, root-integration-build]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-recorder]
    timeout-minutes: 90
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Build the corpus consumer contract test
        working-directory: source/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/cmake --build build/modes/clang-ci-family-incremental --target hft-backtest-session-loader-tests --parallel 4

  corpus-contract-tests:
    name: tests / corpus-consumer-contract
    needs: [snapshot, test-build]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-recorder]
    timeout-minutes: 30
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Run only the real automatic Recorder contract test
        working-directory: source/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-incremental --output-on-failure --no-tests=error --timeout 180 -R '^hft-backtest-session-loader-tests$'

  sanitizer-address-undefined:
    continue-on-error: true
    name: sanitizer / address-undefined
    if: needs.snapshot.outputs.mode == 'own' && needs.production-build.result == 'success'
    needs: [snapshot, production-build]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-recorder]
    timeout-minutes: 180
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Configure the real family ASan and UBSan preset
        working-directory: source/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" source --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON"
          /usr/bin/cmake --preset clang-ci-family-address-undefined-incremental
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" record --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/CXETCPP/build/modes/clang-ci-family-address-undefined-incremental"
      - name: Build the instrumented corpus consumer test
        working-directory: source/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/CXETCPP/build/modes/clang-ci-family-address-undefined-incremental"
          /usr/bin/cmake --build build/modes/clang-ci-family-address-undefined-incremental --target hft-backtest-session-loader-tests --parallel 4
      - name: Run the instrumented corpus consumer contract
        working-directory: source/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/CXETCPP/build/modes/clang-ci-family-address-undefined-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-address-undefined-incremental --output-on-failure --no-tests=error --timeout 180 -R '^hft-backtest-session-loader-tests$'

  publish-buildable-own:
    name: publish-buildable-own
    needs: [snapshot, production-build]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      needs.snapshot.outputs.mode == 'own' && needs.production-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish buildable-own
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-buildable
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE"

  publish-buildable-dependency:
    name: publish-buildable-dependency
    needs: [snapshot, root-integration-build]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      needs.snapshot.outputs.mode == 'dependency' && needs.root-integration-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish buildable-dependency
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-buildable
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE"

  publish-ready:
    name: publish-ready
    needs: [snapshot, prepare, production-build, root-integration-build, test-build, corpus-contract-tests]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      needs.prepare.result == 'success' &&
      (needs.production-build.result == 'success' || (needs.snapshot.outputs.mode == 'dependency' && needs.production-build.result == 'skipped')) &&
      needs.root-integration-build.result == 'success' &&
      needs.test-build.result == 'success' &&
      needs.corpus-contract-tests.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish ready
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE"

  publish-build-failed:
    name: publish-build-failed
    needs: [snapshot, prepare, production-build, root-integration-build]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      (needs.prepare.result == 'failure' || needs.prepare.result == 'cancelled' || needs.production-build.result == 'failure' || needs.production-build.result == 'cancelled' || needs.root-integration-build.result == 'failure' || needs.root-integration-build.result == 'cancelled')
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish build-failed
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-failed
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE" --failure-kind build

  publish-checks-failed:
    name: publish-checks-failed
    needs: [snapshot, prepare, production-build, root-integration-build, test-build, corpus-contract-tests]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      !(needs.prepare.result == 'failure' || needs.prepare.result == 'cancelled' || needs.production-build.result == 'failure' || needs.production-build.result == 'cancelled' || needs.root-integration-build.result == 'failure' || needs.root-integration-build.result == 'cancelled') &&
      (needs.test-build.result == 'failure' || needs.test-build.result == 'cancelled' || needs.corpus-contract-tests.result == 'failure' || needs.corpus-contract-tests.result == 'cancelled')
    runs-on: [self-hosted, linux, x64, wsl, local-control, hft-recorder]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish checks-failed
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-failed
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE" --failure-kind checks
